name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: f2a, POSTGRES_PASSWORD: f2a_dev_password, POSTGRES_DB: f2a_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Migrations apply cleanly and match the models
        env: { DATABASE_URL: "postgresql+psycopg://f2a:f2a_dev_password@localhost:5432/f2a_test" }
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine, text
          e = create_engine("postgresql+psycopg://f2a:f2a_dev_password@localhost:5432/f2a_test")
          with e.begin() as c:
              c.execute(text("DROP SCHEMA public CASCADE; CREATE SCHEMA public"))
          PY
          alembic upgrade head && alembic check
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
