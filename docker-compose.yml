# Production-like stack: PostgreSQL + FastAPI + Next.js (+ nightly backups).
# Usage: cp .env.example .env  (fill the secrets)  &&  docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: f2a_manager
      POSTGRES_USER: f2a
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U f2a -d f2a_manager"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      ENV: production
      DATABASE_URL: postgresql+psycopg://f2a:${POSTGRES_PASSWORD}@db:5432/f2a_manager
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      CORS_ORIGINS: ${PUBLIC_URL:-http://localhost:3000}
      FRONTEND_URL: ${PUBLIC_URL:-http://localhost:3000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@f2a.tn}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - storage:/app/storage
    # not published: only reachable by the frontend through the internal network

  frontend:
    build:
      context: ./frontend
      args: { BACKEND_URL: http://backend:8000 }
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "3000:3000"   # put a TLS reverse proxy (Caddy / Nginx) in front in production

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
    volumes:
      - ./backups:/backups
      - storage:/storage:ro
      - ./deploy/backup.sh:/backup.sh:ro
    # tr strips Windows CR line endings in case the script was checked out with CRLF
    entrypoint: ["sh", "-c", "while true; do tr -d '\\r' < /backup.sh | sh; sleep 86400; done"]

volumes:
  pgdata:
  storage:
